      { "@type": "Question", "name": "What makes human-in-the-loop approval meaningful rather than theatre?",
        "acceptedAnswer": { "@type": "Answer", "text": "Three properties. The reviewer must see the concrete change and how many records it reaches, the approval must be bound to the exact plan it was granted against so it cannot be replayed after a change, and escalation must be a real outcome so reviewers who lack context are not forced to guess." } },
      { "@type": "Question", "name": "What is blast radius in an AI approval gate?",
        "acceptedAnswer": { "@type": "Answer", "text": "The count and identity of the records an action would modify, shown before the write commits. Approving \"update the opportunity records\" without seeing which twelve records is ceremony; approving a diff of twelve named records is review." } },
      { "@type": "Question", "name": "How do you stop an approval being reused against a different action?",
        "acceptedAnswer": { "@type": "Answer", "text": "Bind it to an optimistic-concurrency version token and to the tool schema it was granted against. If the plan or the tool definition changes after approval, the token no longer matches and the write is refused rather than executed against something nobody reviewed." } }
