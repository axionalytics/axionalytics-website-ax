    "mainEntity": [
      { "@type": "Question", "name": "How can a citation be trusted if the model generated it?",
        "acceptedAnswer": { "@type": "Answer", "text": "It cannot, which is why the model does not generate it. Citations are produced deterministically by the backend from the tool-call record, and markers the model invents are stripped before rendering. A citation is a pointer into an execution log rather than a claim the model is making about its own sources." } },
      { "@type": "Question", "name": "What is a grounding critic?",
        "acceptedAnswer": { "@type": "Answer", "text": "A check that runs before a human sees the output. It rejects any generated text referencing an entity absent from the index — a signal, a table, a requirement that does not exist. It catches the failure mode where the answer is well-formed, confident, and about something that is not there." } },
      { "@type": "Question", "name": "Why does a rendered citation link count as a security boundary?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because a link the model produced is an outbound request the interface will make on the user's behalf. If the URL is attacker-controlled, data leaves encoded in the request itself, with no tool call involved and nothing in the network logs that looks like exfiltration." } }
    ]
