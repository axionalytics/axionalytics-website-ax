    "mainEntity": [
      { "@type": "Question", "name": "Where does customer data go in a two-plane architecture?",
        "acceptedAnswer": { "@type": "Answer", "text": "Nowhere outside the customer's own cloud account. The control plane orchestrates sessions, compiles agents, evaluates policy, and collects traces, and holds no customer data at rest. The execution plane runs inside the customer VPC and is the only component that touches customer systems. The two communicate over mutual TLS with W3C trace context propagated across the boundary." } },
      { "@type": "Question", "name": "Why is container isolation insufficient for agent-generated code?",
        "acceptedAnswer": { "@type": "Answer", "text": "Containers share a host kernel, and kernel escapes are a known category of vulnerability rather than a hypothetical one. Agent-generated code is code nobody reviewed before it ran, so the isolation boundary has to be the hypervisor. Each execution runs in a MicroVM with its own kernel, which means a successful escape lands the attacker in an empty virtual machine rather than on a shared host." } },
      { "@type": "Question", "name": "What stops a compromised agent from exfiltrating data?",
        "acceptedAnswer": { "@type": "Answer", "text": "Egress is denied by default. Each sandbox carries an eBPF network filter and a DNS sinkhole restricting outbound traffic to an allowlist the customer defines, and a scanner inspects output for personal data before it leaves. Exfiltration requires a destination, and in this topology there is not one." } }
    ]
