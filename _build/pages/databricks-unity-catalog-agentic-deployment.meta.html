      { "@type": "Question", "name": "How do you connect an AI agent to Databricks Unity Catalog safely?",
        "acceptedAnswer": { "@type": "Answer", "text": "Through a declarative connector manifest rather than code: the catalog is reached with a fixed set of narrow probing tools, not a general query tool. The agent searches the catalog, previews candidate tables, counts rows, and requests aggregates. Every call is validated against a policy the model cannot read, and oversized result sets never enter the model context at all." } },
      { "@type": "Question", "name": "Can an AI agent work against a catalog with tens of thousands of tables?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes, but not by loading the schema. Bulk schema injection collapses on cost, latency, and accuracy somewhere in the low thousands of tables. Retrieval-driven discovery replaces it: the agent searches for candidate tables, inspects the few that look relevant, and narrows from there — the same way an analyst who does not know the warehouse would." } },
      { "@type": "Question", "name": "What happens when a query against Databricks returns too much data?",
        "acceptedAnswer": { "@type": "Answer", "text": "It is never returned to the model. Past a row threshold the connector materialises the result to object storage and hands back a pre-signed URL. The model receives a pointer and a summary; the rows go to the user. This bounds both token cost and exposure, and it is the difference between a demo and something that survives a real catalog." } }
    ]
