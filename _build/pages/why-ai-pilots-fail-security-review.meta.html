      { "@type": "Question", "name": "Why do enterprise AI pilots fail security review?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because the questions security asks are architectural, not configurable. Where inference runs, what the agent may write, whose identity it acts under, what an auditor can reconstruct, and where the data physically sits are all decided by the system's shape. A pilot built without those constraints cannot be adjusted into compliance; it has to be rebuilt." } },
      { "@type": "Question", "name": "When should security be involved in an AI project?",
        "acceptedAnswer": { "@type": "Answer", "text": "Before the first line of code. Deployment topology, data residency, identity provider, egress policy, and audit requirements should be settled in the first two weeks, while they are still cheap to change. Deferring the security conversation to the end is the single most common reason enterprise AI projects miss their date." } },
      { "@type": "Question", "name": "Can a vendor SOC 2 report satisfy an enterprise AI security review?",
        "acceptedAnswer": { "@type": "Answer", "text": "No. A SOC 2 report describes the vendor's own control environment. It does not answer where your data is processed, what the agent is permitted to write, or what your auditors can reconstruct six months later. Those are properties of the deployed architecture, not of the vendor's certification." } }
