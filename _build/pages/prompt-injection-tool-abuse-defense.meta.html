    "mainEntity": [
      { "@type": "Question", "name": "What is prompt injection in an agentic system?",
        "acceptedAnswer": { "@type": "Answer", "text": "Instructions smuggled into content the agent processes — a document, a database field, a tool description, a web page — that the model treats as direction rather than data. It matters more in agentic systems than in chatbots because the model holds tools, so a successful injection redirects actions rather than merely text." } },
      { "@type": "Question", "name": "Can prompt injection be solved by better prompting?",
        "acceptedAnswer": { "@type": "Answer", "text": "No. Instructing a model to ignore embedded instructions raises the cost of an attack without changing what is possible, because the defence and the attack occupy the same channel. Injection has to be contained architecturally: by validating tool calls before dispatch, and by removing the capability an injected instruction would need." } },
      { "@type": "Question", "name": "What is tool shadowing?",
        "acceptedAnswer": { "@type": "Answer", "text": "A connected server registering a tool whose name or description impersonates a trusted one, so the agent selects the malicious tool believing it is the legitimate one. The mitigation is fail-closed name resolution — a collision denies the call rather than resolving it by preference order." } }
    ]
