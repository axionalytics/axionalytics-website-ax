      { "@type": "Question", "name": "How does an AI agent query a database with tens of thousands of tables?",
        "acceptedAnswer": { "@type": "Answer", "text": "By exploring rather than ingesting. Retrieval surfaces a handful of candidate tables from the catalog, then a probing tool suite previews, counts, aggregates, and text-searches them the way an analyst would before committing to an expensive query. The full schema is never injected into the context window." } },
      { "@type": "Question", "name": "Why does injecting a full database schema into the prompt fail at enterprise scale?",
        "acceptedAnswer": { "@type": "Answer", "text": "It fails on three axes at once. A fifty-thousand-table catalog exceeds any context window, the token cost is incurred on every turn regardless of relevance, and accuracy falls as the model selects from thousands of similarly named candidates instead of a ranked shortlist." } },
      { "@type": "Question", "name": "How do you stop an agent pulling millions of rows into a context window?",
        "acceptedAnswer": { "@type": "Answer", "text": "Materialise large result sets to object storage and return a pre-signed pointer plus a summary. The model receives a reference and aggregate statistics rather than raw rows, so cost stays bounded regardless of result size and the sensitive payload never enters the context." } }
