    "mainEntity": [
      { "@type": "Question", "name": "Why do finance teams reject AI business cases?",
        "acceptedAnswer": { "@type": "Answer", "text": "For three predictable reasons: loaded cost per person is understated so the savings look small, the claimed automation rate is implausibly high, and the benefits are unfalsifiable. A case built on a defensible loaded cost, a conservative automation share, and one measurable primary benefit survives review far more often than a larger number built on optimistic inputs." } },
      { "@type": "Question", "name": "What loaded hourly cost should an AI business case use?",
        "acceptedAnswer": { "@type": "Answer", "text": "Fully loaded annual cost divided by roughly 1,880 productive hours, not 2,080. The 2,080 figure assumes fifty-two weeks at forty hours with nobody taking leave; removing paid time off, holidays, training, and non-project time gives the conventional planning figure. Using 2,080 understates hourly cost and flatters the payback." } },
      { "@type": "Question", "name": "What automation rate is credible for enterprise AI?",
        "acceptedAnswer": { "@type": "Answer", "text": "Between roughly 50 and 70 percent of the mechanical portion of a task, not of the task overall. Review, judgment, and exception handling remain human work by design. A case claiming 90 percent or more is describing a system with no human in the loop, which is a system most security teams will not approve." } }
    ]
