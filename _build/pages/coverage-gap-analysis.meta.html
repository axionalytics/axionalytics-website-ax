    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "What is a verification coverage gap?",
        "acceptedAnswer": { "@type": "Answer", "text": "An element of implemented behaviour — a signal, a function, a configuration path — that no test exercises. It differs from code coverage, which measures whether lines executed during a run. A behaviour can be fully line-covered and still have no test asserting that it behaves correctly." } },
      { "@type": "Question", "name": "Why is code coverage insufficient for safety-critical verification?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because it measures execution, not intent. A line executes whenever any test touches it, including tests that assert nothing about the behaviour that line implements. High line coverage with low requirement coverage is common and is exactly the state that produces audit findings." } },
      { "@type": "Question", "name": "How do you find untested behaviour across configuration variants?",
        "acceptedAnswer": { "@type": "Answer", "text": "Enumerate the product of interfaces and configurations, then subtract everything an existing test exercises. The remainder is the gap. Doing that requires an index of what exists, built by parsing the source rather than maintained by hand, because the variant count grows faster than anyone can track." } }
    ]
  }
