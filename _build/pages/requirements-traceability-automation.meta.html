    "mainEntity": [
      { "@type": "Question", "name": "Why do requirements traceability matrices go stale?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because they are maintained separately from the artifacts they describe. The link between a requirement and a test lives in a spreadsheet rather than on the test, so every requirement revision, test edit, or reorganisation silently breaks it and nothing surfaces the break until an audit." } },
      { "@type": "Question", "name": "How can requirements traceability be automated?",
        "acceptedAnswer": { "@type": "Answer", "text": "Generate the link at authoring time rather than reconstructing it later. When a test is produced from a requirement, the requirement identifier and the matched signals are written onto the case as it is created, so traceability is a property of the artifact instead of a parallel document." } },
      { "@type": "Question", "name": "What is bidirectional traceability?",
        "acceptedAnswer": { "@type": "Answer", "text": "The ability to answer both directions: which tests verify this requirement, and which requirement justifies this test. The second direction is the one that finds orphaned tests — cases that survive long after the requirement motivating them was withdrawn." } }
    ]
  }
