  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "What does a write gate actually check before an agent writes?",
        "acceptedAnswer": { "@type": "Answer", "text": "Three things in sequence. The proposed call is validated against a policy the model cannot see or influence. The tool must be present in the signed session manifest compiled for that turn. And a human approves a rendered diff of exactly what would change and how many records it reaches. Any one of the three failing stops the write rather than degrading it." } },
      { "@type": "Question", "name": "How is a human approval protected from being replayed?",
        "acceptedAnswer": { "@type": "Answer", "text": "Every approval is pinned to an optimistic-concurrency version token and to the schema it was granted against. If the underlying plan, the record, or the tool definition changes after approval, the token no longer matches and the write is refused rather than executed against a plan nobody reviewed." } },
      { "@type": "Question", "name": "Why show a diff instead of describing the action?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because a description is a claim by the system about itself, and an approver cannot verify it. A diff of the exact field changes and the record count is evidence. An approval gate that shows a summary rather than the change is a mechanism for manufacturing consent, not for granting it." } }
    ]
  }
