      { "@type": "Question", "name": "Why is legacy test debt so hard to pay down?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because the work is arithmetically impossible by hand. Modernising a suite of several thousand cases at even thirty minutes each consumes multiple engineer-years, which never survives prioritisation against feature delivery. The debt is not tolerated by choice; it is tolerated because no realistic schedule retires it." } },
      { "@type": "Question", "name": "What does modernising a legacy test case actually involve?",
        "acceptedAnswer": { "@type": "Answer", "text": "Restructuring it to a consistent format, adding the pre-conditions the original omitted, enriching it with the interface elements it exercises, and attaching the requirement that justifies it. The assertion logic usually survives unchanged — what is missing is the surrounding structure that makes the case reviewable and traceable." } },
      { "@type": "Question", "name": "Is it safe to let a tool rewrite existing test cases in place?",
        "acceptedAnswer": { "@type": "Answer", "text": "Only behind a field-level diff and human approval. A modernisation pass that overwrites cases unattended can silently weaken an assertion, and nobody would notice until the defect it used to catch escapes. Every change should be shown against the existing case before it is written." } }
