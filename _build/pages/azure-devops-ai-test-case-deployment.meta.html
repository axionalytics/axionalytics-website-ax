    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "Can AI-generated test cases be pushed into Azure DevOps automatically?",
        "acceptedAnswer": { "@type": "Answer", "text": "They can, and in a regulated verification context they should not be. Every generated case stops in a review queue with its source requirement and matched signals displayed alongside it, and only an approved case is written to the work item. The integration deliberately has no unattended write path — an unreviewed write into a test plan is itself a defect." } },
      { "@type": "Question", "name": "How do you authenticate an AI agent against Azure DevOps?",
        "acceptedAnswer": { "@type": "Answer", "text": "OAuth 2.0 client credentials, scoped to the specific project and work item types the agent may touch, with the token held outside the execution sandbox and injected after the request leaves it. Code running in the sandbox cannot read the credential, which matters because agent-generated code is code nobody reviewed before it ran." } },
      { "@type": "Question", "name": "What is the difference between a read and a write operation in an Azure DevOps connector?",
        "acceptedAnswer": { "@type": "Answer", "text": "Reads — querying work items, fetching a test plan, listing fields — pass a policy check and execute. Writes and pipeline triggers stop at a human gate showing exactly what would change, and are marked non-idempotent so a retry after a timeout cannot silently create a duplicate work item or fire a build twice." } }
    ]
  }
