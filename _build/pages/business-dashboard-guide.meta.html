    "mainEntity": [
      { "@type": "Question", "name": "Why do enterprise dashboards get abandoned?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because they were specified from the data that happened to exist rather than from a decision someone has to make. A dashboard that does not change what anyone does has no reason to be opened twice, however well designed it is." } },
      { "@type": "Question", "name": "How do you specify a dashboard that people actually use?",
        "acceptedAnswer": { "@type": "Answer", "text": "Start from a recurring decision, name the person who makes it and the cadence they make it on, then work backwards to the smallest set of metrics that would change that decision. If a metric cannot change the decision, it does not belong on the page." } },
      { "@type": "Question", "name": "How many metrics should an executive dashboard have?",
        "acceptedAnswer": { "@type": "Answer", "text": "Few enough that a reader can absorb the state in about ten seconds. Dashboards fail more often from undifferentiated abundance than from missing data — when everything is present, nothing is prominent, and the reader falls back to asking someone." } }
