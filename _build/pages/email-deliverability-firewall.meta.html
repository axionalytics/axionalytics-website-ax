      { "@type": "Question", "name": "What is a catch-all email domain?",
        "acceptedAnswer": { "@type": "Answer", "text": "A domain configured to accept mail addressed to any name at it, whether or not that mailbox exists. Standard verification cannot distinguish a real recipient from a fabricated one there, because the server accepts both — which is why catch-all domains need separate handling rather than a pass or fail verdict." } },
      { "@type": "Question", "name": "Why is guessing an email address pattern harmful?",
        "acceptedAnswer": { "@type": "Answer", "text": "Because a guessed address that does not exist produces a hard bounce, and bounce rate is the primary signal mail providers use to judge a sender. A few percent of guessed addresses is enough to move a domain from the inbox to the spam folder, including for mail that has nothing to do with outreach." } },
      { "@type": "Question", "name": "How many verification tiers does an address actually need?",
        "acceptedAnswer": { "@type": "Answer", "text": "Three, because they answer different questions. Syntax validation catches malformed and disposable addresses at no cost. A mail-server probe confirms the mailbox exists. Confidence scoring handles catch-all domains, where the first two cannot produce a verdict." } }
