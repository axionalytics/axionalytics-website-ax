    "mainEntity": [
      { "@type": "Question", "name": "What is BYOC deployment for AI?",
        "acceptedAnswer": { "@type": "Answer", "text": "Bring-your-own-cloud splits the system in two. The vendor's control plane orchestrates sessions and holds no customer data at rest, while the execution plane — the only component that touches your systems — runs inside your own cloud account under your IAM, your network policy, and your egress rules." } },
      { "@type": "Question", "name": "Is on-premises AI deployment a reduced feature set?",
        "acceptedAnswer": { "@type": "Answer", "text": "It should not be. If the vendor ships the same codebase across topologies, on-premises is a deployment choice rather than a lagging branch. Ask directly whether the on-premises build trails the hosted one, because a vendor maintaining two codebases will always prioritise the hosted path." } },
      { "@type": "Question", "name": "Can enterprise AI run fully air-gapped?",
        "acceptedAnswer": { "@type": "Answer", "text": "Yes, if inference routes through a gateway you already operate and retrieval embeddings run locally rather than calling a hosted embedding service. Those two dependencies are what usually force outbound access; everything else in a well-designed agent stack can run without egress." } }
