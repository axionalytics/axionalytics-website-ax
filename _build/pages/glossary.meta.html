        "name": "Agentic AI",
        "description": "Agentic AI describes a system where a language model plans and executes a multi-step task using tools, rather than only producing text. It decides which action to take next, calls the tool, observes the result, and repeats until the task is done or a control stops it.",

      {
        "@type": "DefinedTerm",
        "name": "BYOC (Bring Your Own Cloud)",
        "description": "Bring-your-own-cloud is a deployment model where the vendor's software runs inside the customer's own cloud account rather than the vendor's. The vendor operates a control plane that orchestrates work and holds no customer data, while the component that touches customer systems runs entirely within the customer's perimeter.",
        "url": "https://www.axionalytics.com/what-is-byoc.html"

        "@type": "DefinedTerm",
        "name": "Human-in-the-Loop (HITL)",
        "description": "Human-in-the-loop means an automated system pauses at a defined point and requires a person to approve before it proceeds. In an agentic system the gate sits on write actions: reads run freely, while anything that modifies a record stops and shows the reviewer what would change before it commits.",

        "description": "Prompt injection is an attack where instructions are hidden inside content a language model processes — a document, a database field, a tool description — and the model treats them as direction rather than data. In agentic systems it matters more than in chatbots, because the model holds tools and the attack redirects actions.",

        "@type": "DefinedTerm",
        "name": "Email Deliverability",
