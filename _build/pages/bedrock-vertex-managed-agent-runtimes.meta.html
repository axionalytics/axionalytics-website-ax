    "mainEntity": [
      { "@type": "Question", "name": "Do Bedrock Agents or Vertex AI Agent Builder keep data inside our perimeter?",
        "acceptedAnswer": { "@type": "Answer", "text": "They keep it inside the cloud provider's boundary under your account, which satisfies a large number of enterprise requirements and is genuinely strong. What they do not do is keep it inside a perimeter you define independently of that provider. If a contract or regulator constrains processing to your own infrastructure or to a specific jurisdiction the provider does not offer, the managed runtime is the wrong shape." } },
      { "@type": "Question", "name": "What does a managed agent runtime decide for you?",
        "acceptedAnswer": { "@type": "Answer", "text": "Where inference runs, which models are available, how the execution sandbox is isolated, and what the audit record contains. Those are good defaults chosen by a competent provider. They become a problem only when one of them conflicts with a constraint you cannot change, because they are the parts of a managed service you do not get to redesign." } },
      { "@type": "Question", "name": "Does using AWS or Google for agents lock us in?",
        "acceptedAnswer": { "@type": "Answer", "text": "Partially, and in a specific place. Model access and orchestration are portable in principle; the surrounding integration — identity wiring, tool definitions, audit plumbing, the agent definitions themselves — is written against a provider-specific surface. Rebuilding that is the switching cost, and it is usually larger than the model-level portability suggests." } }
    ]
